# ─────────────────────────────────────────────────────────────────────────────
# Softcredible — full-stack compose (frontend + backend + MySQL)
# Secrets come from a sibling `.env` file (gitignored):
#   DB_PASSWORD=...
#   DB_ROOT_PASSWORD=...
#   ADMIN_EMAIL=admin@softcredible.com
#   ADMIN_PASSWORD=...
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Frontend: Nuxt Node server ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://backend:8000/api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - caddy_net

  # ── Backend: Laravel API (php-fpm) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: softcredible
      DB_USERNAME: softcredible
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@softcredible.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-leads@softcredible.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Softcredible}
    volumes:
      - backend-storage:/var/www/html/storage
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - caddy_net
    depends_on:
      db:
        condition: service_healthy

  # ── Database: MySQL 8 ─────────────────────────────────────────────────────
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: softcredible
      MYSQL_USER: softcredible
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  backend-storage:
  db-data:

networks:
  default:
    name: softcredible_default
  # Shared with the host Caddy reverse proxy so it can reach these services
  # by container name (softcredible-frontend-1, softcredible-backend-1).
  caddy_net:
    external: true
